<h1>步步勇者</h1>
<p>用真實步數養成的像素 RPG。今天多走一步，明天就能打贏朋友。</p>

<section>
<h2>支援與問題回報</h2>
<p>遇到問題或有建議，請到 <a href="https://github.com/Rocky84021/step-hero/issues">GitHub 問題回報頁</a> 留言，我們會盡快回覆。</p>
<h2>常見問題</h2>
<p><b>步數沒有增加？</b>請到 iPhone「設定 &gt; 隱私權與安全性 &gt; 動作與健身」確認已允許步步勇者。</p>
<p><b>看不到排行榜或競技場？</b>請先在 iPhone「設定 &gt; Game Center」登入，並登入 iCloud。</p>
<p><b>換手機存檔會不見嗎？</b>目前存檔在裝置上，刪除 App 或換手機會重新開始。</p>
</section>
